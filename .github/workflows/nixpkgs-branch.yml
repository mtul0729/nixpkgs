# 按需验证单个包分支。
#
# 主流水线（nixpkgs-ci）只在 bot 产出候选时审分支：没有更新的分支被当成「上次
# 验证过、没动过」直接跳过。要确认某个分支的当前顶端（比如手改完一个包、或者
# 怀疑上游动了依赖），用这个 workflow 点名跑一次，不碰 update / integration。
#
#   gh workflow run nixpkgs-branch.yml -R mtul0729/nixpkgs -f branch=pkg/activitywatch
#   gh workflow run nixpkgs-branch.yml -R mtul0729/nixpkgs -f branch=pkg/helix -f system=aarch64-linux
#
# 它跑的就是 verify 那一套：nixpkgs-review 只看这个分支相对 nixos-unstable 的改动，
# 构建包在 cachix watch-exec 里，产物直接进 mtul。不写任何分支、不推任何东西。
name: nixpkgs-branch
run-name: nixpkgs-branch (${{ inputs.branch }})

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要验证的分支，例如 pkg/activitywatch"
        type: string
        required: true
      system:
        description: "目标系统"
        type: choice
        options:
          - x86_64-linux
          - aarch64-linux
        default: x86_64-linux

permissions:
  contents: read

# 同一个分支重复触发时只留最新一次：验证的是顶端，旧的没有意义。
concurrency:
  group: branch-${{ inputs.branch }}
  cancel-in-progress: true

env:
  FORK: mtul0729/nixpkgs
  UPSTREAM: NixOS/nixpkgs
  UPSTREAM_BRANCH: nixos-unstable

jobs:
  verify:
    runs-on: ${{ inputs.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # 和主流水线共用同一份 .git 缓存；只恢复不保存，避免每个分支再存一份 1.7 GB。
      - name: Restore the nixpkgs git cache
        uses: actions/cache@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-0
          restore-keys: |
            nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-

      - name: Fetch upstream and the branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p nixpkgs
          git -C nixpkgs rev-parse --git-dir >/dev/null 2>&1 || git -C nixpkgs init -q
          git -C nixpkgs remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git -C nixpkgs remote set-url origin "https://github.com/$UPSTREAM"
          git -C nixpkgs fetch -q --filter=blob:none --no-tags origin \
            "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH"
          git -C nixpkgs fetch -q --no-tags "https://github.com/$FORK" \
            "+refs/heads/$BRANCH:refs/remotes/fork/$BRANCH"
          git -C nixpkgs checkout -q -f -B "$UPSTREAM_BRANCH" "origin/$UPSTREAM_BRANCH"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install nixpkgs-review
        run: nix profile install nixpkgs#nixpkgs-review

      # 不传包名：nixpkgs-review 自己对比 diff 算出要构建什么。
      - name: Review
        env:
          BRANCH: ${{ inputs.branch }}
          SYSTEM: ${{ inputs.system }}
        working-directory: nixpkgs
        run: |
          set -euo pipefail
          sha=$(git rev-parse "refs/remotes/fork/$BRANCH")
          echo "reviewing $BRANCH at $sha on $SYSTEM" >> "$GITHUB_STEP_SUMMARY"
          cachix watch-exec mtul -- nixpkgs-review rev "$sha" -b "$UPSTREAM_BRANCH" --no-shell --system "$SYSTEM"