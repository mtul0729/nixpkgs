# fork 的升级 workflow：把每个包分支升到上游最新版，验证通过才推回分支。
#
# 每个分支一个 matrix leg，在同一个 workspace 里完成：
#   建候选（rebase 到本次 fetch 的 nixos-unstable）→ 改文件（nix-update）
#   → IFD 检查 → 构建 → 提交并推送
# 所以分支上不会出现没验证过的提交，也不需要长期维护的候选分支或回滚。
#
# 候选只在包里确实有新内容时才会推送：单纯有新 upstream 基线不会移动 pkg/
# 分支。pkg/ 分支的基线是更新时的构建输入，不是需要每小时同步的发布状态。
#
# 同一个候选构建失败过，就打一个
# ci-failed/<branch>/<pkg>/<content-hash> 的 tag。hash 取该包版本和定义目录相对
# upstream 的有效 diff，不包含基线本身或同分支其他包的改动。所以 upstream 移动
# 不会绕过标记，别的包自动更新也不会。同一个候选永远不自动重试，删标记、改代码
# 还是换基线由人决定。升级成功后只清该包对应的旧标记。
#
# 任何一条会让腿停下来的路径（基线 rebase 冲突、升级失败、以前构建失败被标记、
# 这次构建失败、推送被拒）都在 fork 上开一个 update-failed 的 issue，同一个标题只开
# 一次、摘要没变就不重复评论；候选推上去、或者下一轮证明那次失败只是抖动之后自动关掉。
#
# 升级这一步会重试：nix-update 抓 release feed 只请求一次，一个 502 就能把腿打掉。
# 网络抖动在重试里消化掉，issue 留给重试也救不回来的失败。
#
# 手动触发：
#   gh workflow run update.yml -R mtul0729/nixpkgs
#   gh workflow run update.yml -R mtul0729/nixpkgs -f only=pkg/helix
#   gh workflow run update.yml -R mtul0729/nixpkgs -f only=pkg/helix -f verify_only=true
name: update
run-name: update (${{ inputs.only || 'all branches' }})

on:
  schedule:
    # 每小时 :13。上游 magpie 一天出好几个 tag，靠的就是这个频率；没有新版本时
    # 每个 leg 只跑一次 nix-update，不构建。
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只处理这些分支（逗号分隔）；留空 = branches.txt 里的全部"
        type: string
      verify_only:
        description: "不升级，只验证选中的分支（配合 only 使用）"
        type: boolean
        default: false

permissions:
  contents: write
  # 包推不动的时候要在 fork 上开/更新 issue —— 日志里的 annotation 通知不到任何
  # 人（job 还是绿的，GitHub 不发邮件），issue 是这条腿上唯一能说话的通道。
  issues: write

env:
  FORK: mtul0729/nixpkgs
  UPSTREAM: NixOS/nixpkgs
  UPSTREAM_BRANCH: nixos-unstable

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      # 只有 nixpkgs-ci/ 目录，不需要整个 fork。
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # branches.txt 是唯一来源；ONLY 只是从里面挑几个跑。
          all=$(grep -v '^[[:space:]]*#' "$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.txt" \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sed 's/:.*//' \
            | jq -R . | jq -sc .)
          if [ -n "${ONLY:-}" ]; then
            want=$(printf '%s' "$ONLY" | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -sc .)
            names=$(jq -c --argjson want "$want" '[.[] | select(. as $b | $want | index($b))]' <<< "$all")
          else
            names="$all"
          fi
          echo "branches=$names" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$names")" >> "$GITHUB_OUTPUT"
          jq -r '.[]' <<< "$names"

  update:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # 队列按分支切，而不是整条 workflow 一把锁。codex 从零编译要一个多小时，
    # 整条 workflow 级的 group 会让它顺带卡住其他所有包的整点升级：新的 run
    # 一直排队，直到那条最慢的腿结束。同一条分支仍然串行，两条 run 碰同一个
    # 分支时靠 --force-with-lease 兜底。
    concurrency:
      group: update-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      # 标准 runner 的根盘默认只剩二十来 GB，而 codex 0.169.0 要编译 1161 个
      # crate：链接时把根盘写满，托管 runner 会被整体回收，日志里只剩 "The runner
      # has received a shutdown signal"（exit 143），连 Nix 的磁盘错误都看不到。
      # 镜像里的工具链这个仓库一个都不用，先删掉；再把 Nix 的临时构建目录放到
      # /mnt 那块大盘上（没有独立 /mnt 时它就是个普通目录，行为不变）。
      - name: Free disk and pick a scratch directory
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/microsoft /usr/local/lib/node_modules
          sudo apt-get clean
          sudo mkdir -p /mnt/nix-build
          sudo chmod 1777 /mnt/nix-build
          df -h / /mnt || true
          free -m

      # 所有 leg 共用一份完整 upstream 历史。partial clone 的 checkout 要为五万多个
      # 文件按需拉 blob，即使没有版本更新也要几分钟；完整缓存让 checkout 全走本地。
      # key 按 UTC 日期滚动：actions/cache 的 key 不可变，静态 key 会永远停在首次
      # 保存的那天，每次都从那天开始补。restore-keys 接上前一天的完整缓存，当天只
      # 有第一条腿上传。update 是唯一写入方；integrate/build-branch 只读，避免它们
      # 用 blob:none 的 fetch 结果把缓存又写回 partial。
      - name: Compute the cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the nixpkgs git cache
        uses: actions/cache@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-full-${{ env.UPSTREAM_BRANCH }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            nixpkgs-git-full-${{ env.UPSTREAM_BRANCH }}-

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # 上一步建好的大盘目录。构建的中间产物（Rust 的 target/）比最终产物
            # 大得多，放在这里才不会和 .git 缓存一起挤爆根盘。
            build-dir = /mnt/nix-build

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `--format` 是到 PATH 里找 `nixfmt` 的，nix-update 自己不带：不装的话每个
      # 包都以 FileNotFoundError 收场，然后被当成「升级失败，跳过」。nixfmt-rs 提供
      # 的可执行文件就叫 nixfmt，输出和 Haskell 原版逐字节相同。
      - name: Install nix-update and nixfmt
        run: nix profile add nixpkgs#nix-update nixpkgs#nixfmt-rs

      - name: Upgrade and verify ${{ matrix.branch }}
        env:
          NIX_PATH: nixpkgs=${{ github.workspace }}/nixpkgs
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          # 大包从零编译要一个多小时，死在链接阶段时日志里只有 runner 的 shutdown，
          # 没有 Nix 的错误。每分钟留一行资源占用，至少能看到它死前到了哪里；
          # 正常结束（包括下面的 exit 0）时 trap 会停掉它。
          (
            while sleep 60; do
              printf '[resmon] %s mem=%s swap=%s root=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/{print $3"/"$2"MB"}')" \
                "$(free -m | awk '/^Swap:/{print $3"/"$2"MB"}')" \
                "$(df -BG / | awk 'NR==2{print $4" free, "$5" used"}')"
            done
          ) &
          resmon=$!
          trap 'kill "$resmon" 2>/dev/null || true' EXIT

          LIST="$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.txt"
          line=$(grep -E "^${BRANCH}(:|$)" "$LIST" | head -1 || true)
          if [ -z "$line" ]; then
            echo "::error::$BRANCH 不在 branches.txt 里"
            exit 1
          fi

          [ -d nixpkgs/.git ] || git init -q nixpkgs
          cd nixpkgs
          git remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git remote set-url origin "https://github.com/$UPSTREAM"
          # 这里不能再用 blob:none：缓存要覆盖完整历史，checkout 才能本地完成。
          git fetch -q --no-tags origin "$UPSTREAM_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags "https://github.com/$FORK" \
            "+refs/heads/$BRANCH:refs/remotes/fork/$BRANCH"
          git checkout -q -f -B bot "refs/remotes/fork/$BRANCH"
          old_tip=$(git rev-parse "refs/remotes/fork/$BRANCH")

          # The by-name packages the branch adds or modifies since it left
          # upstream, plus the ones a line names (`branch: pkg1 pkg2`). The
          # names are a supplement -- a package outside by-name, such as a
          # second attribute in all-packages.nix, which the path diff cannot
          # see -- not a replacement for the diff. The merge base, never the
          # upstream tip: a topic branch does not follow upstream, and a
          # two-point diff would count every upstream change since its base.
          base=$(git merge-base "origin/$UPSTREAM_BRANCH" "refs/remotes/fork/$BRANCH")
          mapfile -t RAW < <(
            git diff --name-only --diff-filter=AM "$base" "refs/remotes/fork/$BRANCH" \
              -- 'pkgs/by-name/*/*/package.nix' \
              | awk -F/ '{print $4}'
            case "$line" in
              *:*) printf '%s' "${line#*:}" | tr ',' '\n' ;;
            esac
          )
          mapfile -t NEW < <(
            printf '%s\n' "${RAW[@]}" \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort -u
          )
          if [ ${#NEW[@]} -eq 0 ]; then
            echo "$BRANCH: no packages"
            exit 0
          fi

          FORK_URL="https://x-access-token:$TOKEN@github.com/$FORK.git"
          RUN_URL="$GITHUB_SERVER_URL/$FORK/actions/runs/$GITHUB_RUN_ID"

          # 日志里的 ::warning:: 不会通知到任何人：job 退出码还是 0，这一轮是绿的，
          # GitHub 只在 run 失败时发信。所以凡是会让这条腿停下来的路径，都在 fork
          # 上开一个 update-failed 的 issue：同一个标题只开一个，摘要没变就不重复
          # 评论（否则同一个问题每小时一条评论），包推上去之后自动关掉。
          gh label create update-failed -R "$FORK" \
            -d "更新 bot 推不动这个包" -c d73a4a >/dev/null 2>&1 || true

          # notify <标题> <摘要>：日志链接放在 <!-- run-link --> 之后，比的时候只
          # 看前面的摘要，所以链接变化不等于新问题。
          notify() {
            local title="$1" summary="$2" key="${3:-$1}" body num last
            body="$summary"$'\n\n'"<!-- run-link -->"$'\n'"日志：$RUN_URL"
            export TITLE="$title" KEY="$key "
            # gh 抽一下风不该把这一轮的包一起拖死：查不到就当没有，写不进去也只
            # 剩日志里的 annotation（每个调用点自己在前面打过了）。
            # 一个 <branch>: <pkg> 只留一个 issue：换版本再失败就在旧 issue 上评论，
            # 否则每发一个新 alpha 就是一个新 issue。key 末尾的空格让它不会把
            # siyuan 和 siyuan-preview 配成同一个。
            num=$(gh issue list -R "$FORK" --label update-failed --state open --limit 1000 \
              --json number,title \
              --jq '[.[] | select((.title == env.TITLE) or (.title | startswith(env.KEY))) | .number][0] // empty' || true)
            if [ -z "$num" ]; then
              gh issue create -R "$FORK" --label update-failed \
                --title "$title" --body "$body" >/dev/null \
                || echo "::warning::$BRANCH: 这个包通知失败了：issue 没开出来"
            else
              last=$(gh issue view "$num" -R "$FORK" --json body,comments \
                --jq '((.comments[-1].body // .body // "") | split("<!-- run-link -->")[0] | sub("\\n+$"; ""))' || true)
              if [ "$last" != "$summary" ]; then
                gh issue comment "$num" -R "$FORK" --body "$body" >/dev/null \
                  || echo "::warning::$BRANCH: 这个包通知失败了：issue #$num 没写进去"
              fi
            fi
            return 0
          }

          # 推上去了，之前挂在 <branch>: <pkg> 上的 issue 可以关了。
          close_issues() {
            local pkg="$1" comment="$2" n
            export PKG_PREFIX="$BRANCH: $pkg " BASELINE_PREFIX="$BRANCH: baseline "
            for n in $(gh issue list -R "$FORK" --label update-failed --state open --limit 1000 \
              --json number,title \
              --jq '[.[] | select((.title | startswith(env.PKG_PREFIX)) or (.title | startswith(env.BASELINE_PREFIX))) | .number][]' || true); do
              gh issue close "$n" -R "$FORK" --comment "$comment" >/dev/null \
                || echo "::warning::$BRANCH: issue #$n 没关掉"
            done
            return 0
          }

          # 一条腿没推东西也可能证明它自己是好的：nix-update 跑通、工作区干净，说明
          # 没有新版本可升，那次「升级失败」只是抓 feed 时的一次 502。
          # 只关标题正好是「升级失败」的 issue —— 构建失败、磁盘写满、推送被拒都还
          # 挂着没解决，不能因为「没有新版本」被顺手关掉。
          close_update_issues() {
            local pkg="$1" comment="$2" n
            export UPGRADE_TITLE="$BRANCH: $pkg 升级失败"
            for n in $(gh issue list -R "$FORK" --label update-failed --state open --limit 1000 \
              --json number,title \
              --jq '[.[] | select(.title == env.UPGRADE_TITLE) | .number][]' || true); do
              gh issue close "$n" -R "$FORK" --comment "$comment" >/dev/null \
                || echo "::warning::$BRANCH: issue #$n 没关掉"
            done
            return 0
          }

          # pkg/ 分支的基线按需移动：先把本次要验证的候选 rebase 到这一轮
          # fetch 的 unstable。没有包更新时这个候选不会推送；有新版本时，
          # 基线和包更新作为一个已经构建过的整体一起推。
          #
          # 基线冲突里最常见的一类：上游也动了同一个包（通常就是一次版本
          # bump），而分支上的版本更新。把分支侧的 package.nix 整份取过来
          # 就是对的语义，但有两个前提：
          #
          #  1. 上游相对 merge base 只改了 version/hash/rev/tag 这类行 ——
          #     取整份分支文件会把上游的其它修改（依赖、构建逻辑）一起丢掉，
          #     那种冲突必须人看。
          #  2. 分支 tip 的版本比上游新。分支上可能有好几次更新，中途那个
          #     提交的版本甚至可能比上游旧；拿 tip 比才是分支真正的意图。
          #
          # 只对 pkgs/by-name/*/*/package.nix 生效，其余冲突仍交给人工。
          upstream_bump_only() {
            local f="$1" line text base_blob up_blob
            base_blob=$(git rev-parse ":1:$f" 2>/dev/null) || return 1
            up_blob=$(git rev-parse ":2:$f" 2>/dev/null) || return 1
            while IFS= read -r line; do
              case "$line" in
                '+'*|'-'*) ;;
                *) continue ;;
              esac
              case "$line" in
                '+++'*|'---'*) continue ;;
              esac
              text="${line:1}"
              case "$text" in
                *'version = "'*';'*|*'hash = "'*';'*|\
                *'sha256 = "'*';'*|*'sha512 = "'*';'*|\
                *'rev = "'*';'*|*'tag = "'*';'*|\
                *'buildCommit = "'*';'*) ;;
                *) return 1 ;;
              esac
            done < <(git diff --unified=0 "$base_blob" "$up_blob")
            return 0
          }

          resolve_version_bump() {
            local f ours newer
            local -a conflicted
            mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
            [ ${#conflicted[@]} -gt 0 ] || return 1
            for f in "${conflicted[@]}"; do
              case "$f" in
                pkgs/by-name/*/*/package.nix) ;;
                *) return 1 ;;
              esac
              upstream_bump_only "$f" || return 1
              ours=$(git show ":2:$f" 2>/dev/null \
                | sed -n 's/^[[:space:]]*version = "\([^"]*\)";$/\1/p' | head -1)
              newer=$(git show "refs/remotes/fork/$BRANCH:$f" 2>/dev/null \
                | sed -n 's/^[[:space:]]*version = "\([^"]*\)";$/\1/p' | head -1)
              [ -n "$ours" ] && [ -n "$newer" ] || return 1
              [ "$newer" != "$ours" ] || return 1
              [ "$(printf '%s\n%s\n' "$ours" "$newer" | sort -V | tail -1)" = "$newer" ] \
                || return 1
            done
            for f in "${conflicted[@]}"; do
              git checkout --theirs -- "$f"
              git add -- "$f"
            done
            echo "$BRANCH: 自动消解版本冲突（取分支侧）：${conflicted[*]}"
            return 0
          }

          auto_resolved=false
          rebase_done=true
          if ! rebase_out=$(git rebase --onto "origin/$UPSTREAM_BRANCH" "$base" 2>&1); then
            rebase_done=false
            while resolve_version_bump; do
              if cont_out=$(GIT_EDITOR=true git rebase --continue 2>&1); then
                rebase_done=true
                auto_resolved=true
                break
              fi
              # 下一个提交又冲突：回到循环开头再按同一规则试一次。
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                continue
              fi
              rebase_out="$cont_out"
              break
            done
          fi
          if [ "$rebase_done" != true ]; then
            git rebase --abort || true
            echo "$rebase_out"
            upstream_short=$(git rev-parse --short "origin/$UPSTREAM_BRANCH")
            echo "::warning::$BRANCH: 无法 rebase 到当前 $UPSTREAM_BRANCH"
            notify "$BRANCH: baseline rebase failed" \
              "$(printf '%s\n\n%s\n\n```\n%s\n```' \
                "\`$BRANCH\` 无法 rebase 到 \`$UPSTREAM_BRANCH@$upstream_short\`，分支没有推送。基线冲突需要人处理。" \
                "rebase 输出尾部：" \
                "$(printf '%s' "$rebase_out" | tail -15)")" \
              "$BRANCH: baseline"
            exit 0
          fi

          # 两条判据，和 pkgs/README.md 里加包的流程一致：IFD 关掉能出 drv，
          # 然后真的构建。测试跑不跑由包自己的 doCheck 决定：pkg/ 分支按政策
          # 设 false，准备给 upstream 的 PR 分支才需要完整测试。产物直接进 mtul。
          verify() {
            local a args=()
            for a in "$@"; do
              nix-instantiate --eval --strict \
                --option allow-import-from-derivation false \
                -A "$a.drvPath" >/dev/null
              args+=(-A "$a")
            done
            cachix watch-exec mtul -- nix-build "${args[@]}" --no-out-link
          }

          if [ "$VERIFY_ONLY" = "true" ]; then
            echo "verify only: ${NEW[*]}"
            verify "${NEW[@]}"
            exit 0
          fi

          names=$(printf '%s\n' "${NEW[@]}" | jq -R . | jq -sc .)
          # A package opts into automatic updates by declaring an updateScript.
          # The same evaluation reports names that do not exist at all: tryEval
          # would otherwise drop a typo from branches.txt silently, and the first
          # complaint would be integrate's "attribute not found" an hour later.
          eval_json=$(nix-instantiate --eval --json --strict --expr "
            let
              pkgs = import ./. { };
              names = builtins.fromJSON ''$names'';
              updatable = builtins.filter
                (n: (builtins.tryEval
                       (builtins.hasAttr n pkgs && (pkgs.\${n} ? updateScript))
                    ).value or false)
                names;
              field = n: f:
                let r = builtins.tryEval (f pkgs.\${n});
                in if r.success then r.value else null;
            in {
              missing = builtins.filter (n: !(builtins.hasAttr n pkgs)) names;
              inherit updatable;
              versions = builtins.listToAttrs
                (map (n: { name = n; value = field n (p: p.version); }) updatable);
              positions = builtins.listToAttrs
                (map (n: { name = n; value = field n (p: p.meta.position); }) updatable);
            }")
          missing=$(jq -c .missing <<< "$eval_json")
          if [ "$missing" != "[]" ]; then
            echo "::error::$BRANCH: branches.txt 声明的属性不存在：$missing"
            exit 1
          fi
          updatable=$(jq -c .updatable <<< "$eval_json")
          echo "updatable: $updatable"

          lease_tip=$old_tip
          for pkg in $(jq -r '.[]' <<< "$updatable"); do
            old=$(jq -r --arg pkg "$pkg" '.versions[$pkg] // empty' <<< "$eval_json")
            if [ -z "$old" ]; then
              echo "::error::$BRANCH: $pkg 的 version 无法求值"
              exit 1
            fi
            before=$(git rev-parse HEAD)
            # nix-update 抓 releases.atom 只请求一次 —— 源码里没有重试，一个 502
            # 就直接抛出来，整条腿失败并开 issue。网络抖动是常态，重试比事后收拾
            # 一条挂死的 issue 便宜得多。只重试这一步：后面的 verify 是确定性
            # 构建，重试它只会浪费 CI 时间，还会掩盖真问题。
            attempts=3
            ok=false
            for attempt in $(seq 1 "$attempts"); do
              if out=$(nix-update -u "$pkg" --format 2>&1); then
                ok=true
                break
              fi
              # nix-update 可能在死之前已经改过 package.nix；重试必须从同一棵树
              # 出发，否则第二次是在半成品上接着改。最后一次也走这里，所以失败
              # 退出时工作区和进循环前一致。
              git reset -q --hard "$before"
              if [ "$attempt" -lt "$attempts" ]; then
                # 普通的 echo，不是 ::warning:: —— 重试成功的轮次不该在 run 摘要
                # 里留警告，那是「这条腿出事了」的通道。
                echo "$pkg: 第 $attempt 次 nix-update 失败，$((attempt * 10))s 后重试"
                sleep $((attempt * 10))
              fi
            done
            if [ "$ok" = false ]; then
              echo "$out"
              echo "::warning::$BRANCH: $pkg 升级失败（试了 $attempts 次），跳过"
              notify "$BRANCH: $pkg 升级失败" \
                "$(printf '%s\n\n%s\n\n```\n%s\n```' \
                  "\`$pkg\` 停在 $old：\`nix-update\` 连续 $attempts 次失败，这一轮没有往 \`$BRANCH\` 推任何东西。" \
                  "\`nix-update\` 最后一次的输出尾部：" \
                  "$(printf '%s' "$out" | tail -15)")" \
                "$BRANCH: $pkg"
              continue
            fi
            if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
              echo "$pkg: already at $old"
              close_update_issues "$pkg" \
                "\`$pkg\` 仍是 $old：这一轮 \`nix-update\` 跑通了、没有可推的版本，上一次是抓 feed 时的网络抖动。"
              continue
            fi
            new=$(nix-instantiate --eval --raw -A "$pkg.version")
            # nix-update can update one package on a branch that carries several.
            # Another package succeeding is not a human decision to retry this one.
            # Key on the version and package definition, not the whole branch or a
            # shared data file that a sibling's update may also rewrite.
            position=$(jq -r --arg pkg "$pkg" '.positions[$pkg] // ""' <<< "$eval_json")
            pkg_scope=()
            if [ -n "$position" ]; then
              pkg_scope+=("$(dirname "${position%:*}")")
            fi
            git add -A pkgs
            content=$(
              {
                printf 'version=%s\n' "$new"
                if [ ${#pkg_scope[@]} -gt 0 ]; then
                  git diff --cached --binary "origin/$UPSTREAM_BRANCH" -- "${pkg_scope[@]}"
                fi
              } | git hash-object --stdin
            )
            tag="ci-failed/$BRANCH/$pkg/$content"
            # 这个候选已经试过并失败，不再自动重试。hash 不包含 upstream 基线
            # 或同分支其他包的历史改动：单纯 rebase、别的包更新都不会绕过人工闸门。
            if git ls-remote --exit-code "$FORK_URL" "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::warning::$pkg $new 上次构建失败过（$tag），跳过"
              # 不通知：这是 backoff 的预期行为，annotation 已经写进 run 摘要，
              # 该候选对应的失败 issue 本来就开着；每轮通知等于每小时一条。
              git reset -q --hard "$before"
              continue
            fi
            build_log="$RUNNER_TEMP/build-$pkg.log"
            if ! verify "$pkg" 2>&1 | tee "$build_log"; then
              # 环境失败不是候选的属性：换一台 runner 就可能过。打成 ci-failed
              # 会把这个版本永久钉住，只能等人删 tag；这种只跳过这一轮。
              if grep -qi 'No space left on device' "$build_log"; then
                echo "::warning::$BRANCH: $pkg $new 构建时 runner 磁盘写满（环境问题），下一轮重试"
                df -h /
                notify "$BRANCH: $pkg 构建环境磁盘写满" \
                  "\`$pkg\` $old -> $new 在构建时把 runner 的磁盘写满了。这是构建环境的问题，不是候选的问题：没有打 \`ci-failed\`，下一轮会在新的 runner 上重试。" \
                  "$BRANCH: $pkg"
                git reset -q --hard "$before"
                continue
              fi
              echo "::warning::$BRANCH: $pkg $new 构建失败，标记后跳过"
              notify "$BRANCH: $pkg $new 构建失败" \
                "\`$pkg\` $old -> $new 没有构建过，已经标成 \`$tag\`：同样的内容不会重试第二次。"$'\n\n'"构建输出在这一轮的日志里。要在同一个版本上再来一次，先删掉 \`$tag\`。" \
                "$BRANCH: $pkg"
              git tag -f "$tag" "refs/remotes/fork/$BRANCH"
              git push -f "$FORK_URL" "refs/tags/$tag" || true
              git reset -q --hard "$before"
              continue
            fi
            git commit -q -m "$pkg: $old -> $new"
            if git push --force-with-lease="refs/heads/$BRANCH:$lease_tip" \
              "$FORK_URL" "HEAD:refs/heads/$BRANCH"; then
              echo "pushed $pkg: $old -> $new"
              lease_tip=$(git rev-parse HEAD)
              close_issues "$pkg" "\`$pkg\` 已经推到 $new。"
              # 只清理这个包已经解决的失败标记，别抹掉同分支其他包的人工闸门。
              for t in $(git ls-remote --tags "$FORK_URL" "refs/tags/ci-failed/$BRANCH/$pkg/*" \
                | awk '{print $2}' | sed 's|^refs/tags/||'); do
                git push "$FORK_URL" --delete "refs/tags/$t" || true
              done
            else
              echo "::warning::$BRANCH: 推送失败（分支刚被改过），这次跳过"
              notify "$BRANCH: $pkg 推送被拒" "\`$pkg\` $old -> $new 验过了，但推不上去：\`$BRANCH\` 刚被改过（多半是人推的）。改动已回滚，下一轮重来。" \
                "$BRANCH: $pkg"
              git reset -q --hard "$before"
            fi
          done

          # 只消解了 rebase 冲突、没有包升级时，上面的循环什么都没推。但分支
          # 相对新基线的 diff 已经变了，不推的话 integrate 每小时还会撞同一个
          # 冲突。和包升级走同一条判据：先构建，绿了再推。
          if [ "$auto_resolved" = true ] && [ "$lease_tip" = "$old_tip" ]; then
            echo "$BRANCH: 基线冲突已自动消解，构建后推送"
            if verify "${NEW[@]}"; then
              if git push --force-with-lease="refs/heads/$BRANCH:$lease_tip" \
                "$FORK_URL" "HEAD:refs/heads/$BRANCH"; then
                echo "pushed $BRANCH: baseline -> $UPSTREAM_BRANCH"
                close_issues baseline "\`$BRANCH\` 的基线冲突已自动消解并推送。"
              else
                echo "::warning::$BRANCH: 基线推送失败（分支刚被改过）"
                notify "$BRANCH: baseline 推送被拒" \
                  "\`$BRANCH\` 的基线冲突已自动消解、也构建过了，但推不上去：分支刚被改过（多半是人推的）。下一轮重来。" \
                  "$BRANCH: baseline"
              fi
            else
              notify "$BRANCH: baseline 自动消解后构建失败" \
                "\`$BRANCH\` 的基线冲突按「分支版本更新」自动消解了，但在新基线上构建失败；分支没有推送。要么改包，要么手工把基线 rebase 上去。" \
                "$BRANCH: baseline"
            fi
          fi
