# 个人 CI，只存在于 fork 的 master 上。
#
# fork 首先是自维护包的地方，其次才是待提交 PR 的暂存区：nixpkgs-ci/branches.txt
# 里的每个分支都是一组包，提不提 PR 都行，CI 一律按同样的方式处理。
#
# 三个 job，按依赖串起来：
#
#   1. update —— fork 自己的 bot。对 branches.txt 里每个分支，找出它新增的 by-name
#      包里声明了 passthru.updateScript 的那些，跑 nix-update -u。改动不直接落到
#      包分支上，而是提交到 ci/<分支> 这个候选引用：包分支只在验证通过后才前进。
#      没声明 updateScript 的包是手动 pin 的，bot 不碰。
#
#   2. verify —— 对每个候选跑 nixpkgs-review，只看这个分支相对 nixos-unstable 的
#      改动。通过才把候选快进到真正的包分支并删掉候选；失败就丢弃候选，包分支
#      保持原样。所以包分支上不会出现没验证过的提交，也就不需要回滚。
#
#   3. integrate —— 生成 integration 分支 = NixOS/nixpkgs 的 nixos-unstable ＋
#      branches.txt 里的分支依次 rebase 上去，然后把这些分支声明的属性构建一遍。
#      逐包验证已经在 verify 做过，这里只确认合起来还能 eval、还能构建；命中
#      cache 时这一步只是下载。
#
# 包分支不要求干净、不要求单提交：rebase 只重放它相对 upstream 的那几个提交，
# 冲突的分支会被跳过并点名，不挡住其他包的缓存。
#
# 手动触发：
#   gh workflow run nixpkgs-ci.yml -R mtul0729/nixpkgs
#   gh workflow run nixpkgs-ci.yml -R mtul0729/nixpkgs -f only=pkg/dashbeam
#   gh workflow run nixpkgs-ci.yml -R mtul0729/nixpkgs -f skip_update=true
#
# fork 里的 schedule 默认是关的，第一次要去 Actions 页面点 "Enable workflow"，
# 否则每小时那次不会发生（workflow_dispatch 不受影响）。
name: nixpkgs-ci
run-name: nixpkgs-ci (${{ inputs.only || 'all branches' }})

on:
  schedule:
    # 每小时 :13。上游 magpie 一天出好几个 tag，靠的就是这个频率；没有新版本时
    # update job 只 fetch 两个 feed，不花构建时间。
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只跑这些分支（逗号分隔）；留空 = branches.txt 里的全部。手动点名某个分支时，即使没有 bot 候选也会审一次它的当前顶端"
        type: string
      skip_update:
        description: "跳过升级，只做集成与构建"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - nixpkgs-ci/**
      - .github/workflows/nixpkgs-ci.yml

permissions:
  contents: write

# One run at a time. Every run rebases this commit onto upstream master and
# force-pushes both master and integration, so two concurrent runs race each
# other: stale force-with-lease, integration overwritten by the older run, and
# duplicated reviews building the same packages. Queue instead of cancelling --
# a run that is already building is worth finishing.
concurrency:
  group: nixpkgs-ci
  cancel-in-progress: false

env:
  FORK: mtul0729/nixpkgs
  UPSTREAM: NixOS/nixpkgs
  # Everything tracks nixos-unstable, not master: the consuming systems run
  # unstable, so basing on the same commit the official cache was built from
  # keeps derivations identical instead of duplicating them.
  UPSTREAM_BRANCH: nixos-unstable
  INTEGRATION: integration

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
      update: ${{ steps.plan.outputs.update }}
      branches: ${{ steps.plan.outputs.branches }}
    steps:
      # 只有 nixpkgs-ci/ 目录，不需要整个 fork。
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SKIP_UPDATE: ${{ inputs.skip_update }}
        run: |
          set -euo pipefail
          # branches.txt 是唯一来源；ONLY 只是从里面挑几个跑。
          all=$(grep -v '^[[:space:]]*#' "$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.txt" \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sed 's/:.*//' \
            | jq -R . | jq -sc .)
          if [ -n "${ONLY:-}" ]; then
            want=$(printf '%s' "$ONLY" | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -sc .)
            names=$(jq -c --argjson want "$want" '[.[] | select(. as $b | $want | index($b))]' <<< "$all")
          else
            names="$all"
          fi
          echo "branches=$names" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$names")" >> "$GITHUB_OUTPUT"
          echo "update=$([ "${SKIP_UPDATE:-false}" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          jq -r '.[]' <<< "$names"

  update:
    needs: plan
    if: needs.plan.outputs.update == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      - name: Restore the nixpkgs git cache
        uses: actions/cache@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-${{ strategy.job-index }}
          restore-keys: |
            nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install nix-update and nixfmt
        run: nix profile install nixpkgs#nix-update nixpkgs#nixfmt

      - name: Upgrade ${{ matrix.branch }}
        env:
          NIX_PATH: nixpkgs=${{ github.workspace }}/nixpkgs
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          LIST="$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.txt"
          line=$(grep -E "^${BRANCH}(:|$)" "$LIST" | head -1 || true)
          if [ -z "$line" ]; then
            echo "::error::$BRANCH 不在 branches.txt 里"
            exit 1
          fi

          if [ ! -d nixpkgs/.git ]; then
            git init -q nixpkgs
          fi
          cd nixpkgs
          git remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git remote set-url origin "https://github.com/$UPSTREAM"
          git fetch -q --filter=blob:none --no-tags origin "$UPSTREAM_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags "https://github.com/$FORK" \
            "+refs/heads/$BRANCH:refs/remotes/fork/$BRANCH"
          git checkout -q -f -B bot "refs/remotes/fork/$BRANCH"
          # 上一轮可能留下没验证完的候选（run 被取消之类）；先清掉，
          # 否则 verify 会去审一个和这次无关的提交。
          git push "https://x-access-token:$TOKEN@github.com/$FORK.git" \
            --delete "refs/heads/ci/$BRANCH" 2>/dev/null || true

          # A line may name its packages (`branch: pkg1 pkg2`); otherwise take
          # the by-name packages the branch adds or modifies since it left
          # upstream. The merge base, never the upstream tip: a topic branch
          # does not follow upstream, and a two-point diff would count every
          # upstream change since its base.
          case "$line" in
            *:*) read -r -a NEW <<< "$(printf '%s' "${line#*:}" | tr ',' ' ')" ;;
            *)
              base=$(git merge-base "origin/$UPSTREAM_BRANCH" "refs/remotes/fork/$BRANCH")
              mapfile -t NEW < <(
                git diff --name-only --diff-filter=AM "$base" "refs/remotes/fork/$BRANCH" \
                  -- 'pkgs/by-name/*/*/package.nix' \
                  | awk -F/ '{print $4}' | sort -u
              )
              ;;
          esac
          if [ ${#NEW[@]} -eq 0 ]; then
            echo "$BRANCH: no packages"
            exit 0
          fi

          names=$(printf '%s\n' "${NEW[@]}" | jq -R . | jq -sc .)
          # A package opts into automatic updates by declaring an updateScript.
          updatable=$(nix-instantiate --eval --json --strict --expr "
            let pkgs = import ./. { };
            in builtins.filter
                 (n: (builtins.tryEval (pkgs.\${n} ? updateScript)).value or false)
                 (builtins.fromJSON ''$names'')")
          echo "updatable: $updatable"

          for pkg in $(jq -r '.[]' <<< "$updatable"); do
            old=$(nix-instantiate --eval --raw -A "$pkg.version")
            # 失败时回到这个包开始之前，而不是分支顶端：同一分支里前面几个包
            # 已经提交的更新不能被后面的失败带走。
            before=$(git rev-parse HEAD)
            # 只改文件，不构建：候选要过 verify 那一关才算数，构建在那边做
            # 一次就够，这里再建一遍只是白花时间。
            if ! nix-update -u "$pkg" --format; then
              echo "::warning::$BRANCH: $pkg 升级失败，这个包跳过"
              git reset -q --hard "$before"
              continue
            fi
            if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
              echo "$pkg: already at $old"
              continue
            fi
            new=$(nix-instantiate --eval --raw -A "$pkg.version")
            git add -A pkgs
            git commit -q -m "$pkg: $old -> $new"
            # 候选引用是草稿，直接覆盖；包分支要等 verify 通过才动。
            if git push --force "https://x-access-token:$TOKEN@github.com/$FORK.git" \
              "HEAD:refs/heads/ci/$BRANCH"; then
              echo "candidate $pkg: $old -> $new"
            else
              echo "::warning::$BRANCH: 推送候选失败，这个包跳过"
              git reset -q --hard "$before"
            fi
          done

  integrate:
    needs: [plan, update, verify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      # 只要 nixpkgs-ci/ 目录，不用把 fork 的整个 nixpkgs 历史拖下来。
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      # nixpkgs 的历史里绝大多数是 blob，而 rebase 只要 commit 和 tree；
      # blob:none 让这一步从十几分钟降到一两分钟，检出时再按需拉当前树。
      - name: Restore the nixpkgs git cache
        uses: actions/cache@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-${{ strategy.job-index }}
          restore-keys: |
            nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-

      - name: Fetch upstream
        run: |
          set -euo pipefail
          # Full commit graph without blobs, restored from the cache when there
          # is one: on a cold runner this fetch alone costs ~5 minutes over
          # nixpkgs' ~1M commits.
          mkdir -p nixpkgs
          git -C nixpkgs rev-parse --git-dir >/dev/null 2>&1 || git -C nixpkgs init -q
          git -C nixpkgs remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git -C nixpkgs remote set-url origin "https://github.com/$UPSTREAM"
          git -C nixpkgs fetch -q --filter=blob:none --no-tags origin \
            "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH"
          git -C nixpkgs checkout -q -f -B "$UPSTREAM_BRANCH" "origin/$UPSTREAM_BRANCH"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # GITHUB_TOKEN 推不了：integration 分支第一次出现时，整棵 nixpkgs 树都算
      # "新增的 workflow 文件"，需要 workflow 权限。PUSH_TOKEN 是有 workflow
      # scope 的 PAT。
      - name: Rebase pending branches onto upstream master
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd nixpkgs
          git config user.name "myul"
          git config user.email "hdx0729@gmail.com"

          # One branch per line. A line may also name the packages the bot
          # should look at: `activitywatch: aw-server-rust aw-webui`. A package
          # outside pkgs/by-name cannot be found by diffing file paths, so a
          # branch that carries one declares it here.
          LIST="$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.txt"
          declare -A EXPLICIT=()
          BRANCHES=()
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            b="${line%%:*}"
            b="$(printf '%s' "$b" | sed 's/[[:space:]]*$//')"
            [ -n "$b" ] || continue
            BRANCHES+=("$b")
            case "$line" in
              *:*) EXPLICIT["$b"]="$(printf '%s' "${line#*:}" | tr ',' ' ')" ;;
            esac
          done < <(grep -v '^[[:space:]]*#' "$LIST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ ${#BRANCHES[@]} -eq 0 ]; then
            echo "::error::$LIST 里一个分支都没有；是文件丢了还是格式不对？"
            exit 1
          fi
          echo "branches: ${BRANCHES[*]}"

          # 只取这些分支自己的对象，不碰 fork 的 nixpkgs 历史。
          refspecs=()
          for b in "${BRANCHES[@]}"; do
            refspecs+=("+refs/heads/$b:refs/remotes/fork/$b")
          done
          git fetch --no-tags "https://github.com/$FORK" "${refspecs[@]}"

          git fetch -q --no-tags origin "$UPSTREAM_BRANCH"
          git checkout -B "$INTEGRATION" "origin/$UPSTREAM_BRANCH"
          failed=()
          merged=()
          for b in "${BRANCHES[@]}"; do
            echo "::group::$b"
            # 只重放这个分支相对 upstream 的提交。从 fork master 拉出来的分支会
            # 带一个 CI 提交，merge-base 把它排除在外；分支有几个提交都无所谓。
            base=$(git merge-base "$INTEGRATION" "refs/remotes/fork/$b")
            git checkout -B "pending-$b" "refs/remotes/fork/$b"
            if git rebase --onto "$INTEGRATION" "$base"; then
              git checkout "$INTEGRATION"
              git merge --ff-only "pending-$b"
              merged+=("$b")
            else
              git rebase --abort || true
              git checkout "$INTEGRATION"
              failed+=("$b")
              echo "::error::$b 与 upstream master 冲突，这次先跳过它"
            fi
            echo "::endgroup::"
          done

          git log --oneline "origin/$UPSTREAM_BRANCH..HEAD"
          git push --force "https://x-access-token:$TOKEN@github.com/$FORK.git" \
            "HEAD:refs/heads/$INTEGRATION"

          # 合进来的分支各自声明了哪些属性：显式列表优先，否则按 by-name 目录名。
          : > "$RUNNER_TEMP/attrs.txt"
          for b in "${merged[@]}"; do
            if [ -n "${EXPLICIT[$b]:-}" ]; then
              printf '%s\n' ${EXPLICIT[$b]} >> "$RUNNER_TEMP/attrs.txt"
            else
              base=$(git merge-base "origin/$UPSTREAM_BRANCH" "refs/remotes/fork/$b")
              git diff --name-only --diff-filter=AM "$base" "refs/remotes/fork/$b" \
                -- 'pkgs/by-name/*/*/package.nix' | awk -F/ '{print $4}' \
                >> "$RUNNER_TEMP/attrs.txt"
            fi
          done
          sort -u "$RUNNER_TEMP/attrs.txt" -o "$RUNNER_TEMP/attrs.txt"
          echo "will build: $(tr '\n' ' ' < "$RUNNER_TEMP/attrs.txt")"

          # 有分支没合进来时 job 要红，但 integration 已经推出去了：其余包照常
          # 有缓存，不会因为一个包卡住整条链。
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::以下分支没能 rebase，integration 里暂时没有它们：${failed[*]}"
            exit 1
          fi

      # master 只是 CI 文件的容器，但让它保持「upstream master + CI 提交」这个
      # 形状：否则它会悄悄落后几千个提交，分支列表看着像死仓库，从它起的分支
      # 也带着很老的 base。这里已经有完整的 upstream 历史，顺手做掉。
      - name: Rebase the CI commit onto upstream master
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd nixpkgs
          git fetch --no-tags "https://github.com/$FORK" \
            "+refs/heads/master:refs/remotes/fork/master"
          old=$(git rev-parse refs/remotes/fork/master)
          git checkout -q -B fork-master "$old"

          if ! git rebase "origin/$UPSTREAM_BRANCH"; then
            git rebase --abort
            echo "::error::fork master 上的提交没法 rebase 到 upstream master，需要手工处理"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$old" ]; then
            echo "master 已经是最新的 upstream + CI 提交"
            exit 0
          fi

          # 这次推送是 CI 自己制造的（只是把 CI 提交挪到新 master 上），别让它
          # 再触发一整轮构建。两个 -m 之间 git 会插一个空行。
          # 旧 message 里已经有上一轮留下的 [skip ci]，先剥掉再加，否则每小时
          # rebase 一次就多一行。
          git commit -q --amend -m "$(git log -1 --format=%B | sed '/^\[skip ci\]$/d')" -m "[skip ci]"
          git push --force-with-lease="refs/heads/master:$old" \
            "https://x-access-token:$TOKEN@github.com/$FORK.git" "HEAD:refs/heads/master"


      # 逐包验证在 verify 做过；这里只确认合起来的树还能 eval、还能构建。
      # 命中 cache 时是下载，只有 drv 真变了（上游动了依赖）才会编译 —— 那种
      # 情况本来就该让这轮变红。
      - name: Build what the branches carry
        run: |
          set -euo pipefail
          cd nixpkgs
          mapfile -t attrs < "$RUNNER_TEMP/attrs.txt"
          if [ ${#attrs[@]} -eq 0 ]; then
            echo "no attributes to build"
            exit 0
          fi
          args=()
          for a in "${attrs[@]}"; do args+=(-A "$a"); done
          echo "building: ${attrs[*]}"
          cachix watch-exec mtul -- nix-build "${args[@]}" --no-out-link

  verify:
    needs: [plan, update]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && needs.plan.outputs.update == 'true'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # 没候选就什么都不做：这一轮这个分支没有可验证的东西，别为它付清盘的钱。
      - name: Look for a candidate
        id: cand
        env:
          BRANCH: ${{ matrix.branch }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$FORK" "refs/heads/ci/$BRANCH" | cut -f1)
          publish=true
          if [ -z "$sha" ]; then
            # 手动 only=<branch> 时，没有候选也审一次分支顶端：改完包想立刻拿
            # 反馈就走这条，不用等 bot 产出候选。
            case ",${ONLY:-}," in
              *",$BRANCH,"*)
                sha=$(git ls-remote "https://github.com/$FORK" "refs/heads/$BRANCH" | cut -f1)
                publish=false
                ;;
              *)
                echo "$BRANCH: 没有候选，跳过"
                echo "has=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          echo "$BRANCH: 审 $sha（publish=$publish）"
          echo "has=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.cand.outputs.has == 'true'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Restore the nixpkgs git cache
        if: steps.cand.outputs.has == 'true'
        uses: actions/cache@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-${{ strategy.job-index }}
          restore-keys: |
            nixpkgs-git-${{ env.UPSTREAM_BRANCH }}-

      - name: Fetch upstream and the candidate
        if: steps.cand.outputs.has == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          mkdir -p nixpkgs
          git -C nixpkgs rev-parse --git-dir >/dev/null 2>&1 || git -C nixpkgs init -q
          git -C nixpkgs remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git -C nixpkgs remote set-url origin "https://github.com/$UPSTREAM"
          git -C nixpkgs fetch -q --filter=blob:none --no-tags origin \
            "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH"
          git -C nixpkgs fetch -q --no-tags "https://github.com/$FORK" \
            "+refs/heads/$BRANCH:refs/remotes/fork/$BRANCH"
          # 手动审分支顶端时没有候选引用，别让 fetch 因此失败。
          if git ls-remote --exit-code "https://github.com/$FORK" "refs/heads/ci/$BRANCH" >/dev/null; then
            git -C nixpkgs fetch -q --no-tags "https://github.com/$FORK" \
              "+refs/heads/ci/$BRANCH:refs/remotes/candidate/$BRANCH"
          fi
          git -C nixpkgs checkout -q -f -B "$UPSTREAM_BRANCH" "origin/$UPSTREAM_BRANCH"

      - uses: cachix/install-nix-action@v31
        if: steps.cand.outputs.has == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        if: steps.cand.outputs.has == 'true'
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install nixpkgs-review
        if: steps.cand.outputs.has == 'true'
        run: nix profile install nixpkgs#nixpkgs-review

      # 只有这里通过，候选才会快进到包分支；失败就什么都不动，分支保持原样。
      - name: Review and publish
        if: steps.cand.outputs.has == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
          SHA: ${{ steps.cand.outputs.sha }}
          PUBLISH: ${{ steps.cand.outputs.publish }}
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        working-directory: nixpkgs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cachix watch-exec mtul -- nixpkgs-review rev "$SHA" -b "$UPSTREAM_BRANCH" --no-shell --system x86_64-linux
          if [ "$PUBLISH" = "true" ]; then
            # 候选是包分支的线性后代，merge-base 就是候选创建时的分支顶端；
            # 拿它当 lease，期间有人推过分支就不会覆盖。
            old=$(git merge-base "refs/remotes/fork/$BRANCH" "refs/remotes/candidate/$BRANCH")
            git push --force-with-lease="refs/heads/$BRANCH:$old" \
              "https://x-access-token:$TOKEN@github.com/$FORK.git" "$SHA:refs/heads/$BRANCH"
            git push "https://x-access-token:$TOKEN@github.com/$FORK.git" --delete "refs/heads/ci/$BRANCH" || true
            echo "published $BRANCH -> $SHA"
          else
            echo "$BRANCH 已经是 $SHA，只审不推"
          fi
