# 把 branches.toml 里的分支合成 integration 并发布。
#
# integration = NixOS/nixpkgs 的 nixos-unstable ＋ 每个分支的有效 diff 各压成一个
# 提交。sysadmin 引 github:mtul0729/nixpkgs/integration，所以这一步是唯一的发布动作。
#
# 合并之后把这些分支声明的属性构建一遍：分支各自验证时用的是自己的 base，
# 而 integration 用的是今天的 unstable —— 上游动了依赖，drv 就变，这里会重编，
# 编不过就红。没变化时只是下载，几乎不花时间。全部构建通过后才把 integration
# 指针移过去，所以分支 tip 一定是一个已经有缓存的 rev。
#
# 触发：update 跑完自动接、手动。没有独立的定时排班——update 每小时都会跑，
# 完成即接；再加一条 :43 只会在同一小时里把同样的合成和构建做第二遍。
name: integrate

on:
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate
  cancel-in-progress: false

env:
  FORK: mtul0729/nixpkgs
  UPSTREAM: NixOS/nixpkgs
  UPSTREAM_BRANCH: nixos-unstable
  INTEGRATION: integration

jobs:
  integrate:
    # update 失败也要跑：一条腿失败不该挡住其余分支发布。但被取消的那次什么都没
    # 推，重放它只会把上一次 integration 再发一遍。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    # codex 缓存一失效就要重编 90 分钟以上，旧的 120 分钟只够勉强容下
    # 拉取、合并和发布，中途再有一次慢步骤就整轮作废。留到 180。
    timeout-minutes: 180
    steps:
      # 只要 nixpkgs-ci/ 目录，不用把 fork 的整个 nixpkgs 历史拖下来。
      - uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: nixpkgs-ci
          sparse-checkout-cone-mode: false

      # 这条 job 真的编译，而 runner 只有 ~14 GB。11:34 那次就是 staging
      # magpie 的 go-modules 时写满 /nix/store。清掉镜像里用不到的 SDK 能腾出
      # 二十来 GB，只花 ~50 秒；update 的腿不跑这一步，因为它们通常只做升级。
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # 合并不是只下载：上游动了依赖，drv 就变，codex 那一份要重编一个半小时
      # 以上，链接峰值和 update 的腿是同一处。11-18 那次整合在 1h31m 处报
      # runner lost communication，日志同样戛然而止，所以给它同一块 swap。
      - name: Add swap
        run: |
          set -euo pipefail
          if [ "$(free -g | awk '/^Swap:/{print $2}')" -lt 10 ]; then
            sudo fallocate -l 16G /swapfile-extra
            sudo chmod 600 /swapfile-extra
            sudo mkswap -q /swapfile-extra
            sudo swapon /swapfile-extra
          fi
          df -h /
          free -m
          swapon --show

      # update 现在写的是完整 .git，所以这里的 checkout 主要走本地；上游新提交
      # 仍用 blob:none 拉，只按需取当前树的 blob。这个 job 只读缓存：如果它也
      # 用 blob:none 的结果回存，就会把 update 的完整缓存重新变成 partial。
      # key 按 UTC 日期滚动，与 update 共用同一天的那一份。
      - name: Compute the cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the nixpkgs git cache
        uses: actions/cache/restore@v6
        with:
          path: nixpkgs/.git
          key: nixpkgs-git-full-${{ env.UPSTREAM_BRANCH }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            nixpkgs-git-full-${{ env.UPSTREAM_BRANCH }}-

      - name: Fetch upstream
        run: |
          set -euo pipefail
          mkdir -p nixpkgs
          git -C nixpkgs rev-parse --git-dir >/dev/null 2>&1 || git -C nixpkgs init -q
          git -C nixpkgs remote add origin "https://github.com/$UPSTREAM" 2>/dev/null \
            || git -C nixpkgs remote set-url origin "https://github.com/$UPSTREAM"
          git -C nixpkgs fetch -q --filter=blob:none --no-tags origin \
            "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH"
          git -C nixpkgs checkout -q -f -B "$UPSTREAM_BRANCH" "origin/$UPSTREAM_BRANCH"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Squash the branches onto upstream
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd nixpkgs
          git config user.name "myul"
          git config user.email "hdx0729@gmail.com"

          # 目录树里缺的 blob 由 promisor remote 按需补取。GitHub 对匿名请求
          # 会回 403 —— 2026-11-25 那次就是这样在最后的 checkout 上 exit 128。
          # 只给 fork 的 URL 带 token，upstream 保持匿名：PUSH_TOKEN 可能只对
          # 这个仓库有权限，拿它去访问 NixOS/nixpkgs 反而会从能读变成 403。
          # 用 GIT_CONFIG_* 而不是写 .git/config，口令不该留在被复用的 cache 里。
          if [ -n "${TOKEN:-}" ]; then
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/$FORK/.extraheader"
            export GIT_CONFIG_VALUE_0="$header"
          fi

          # 取对象失败是传输问题，重试有意义；git 自己的 0/1（1 = 冲突）是
          # 结论，重试只会白等。
          retry_git() {
            local attempt rc
            attempt=1
            while :; do
              rc=0
              "$@" || rc=$?
              if [ "$rc" -le 1 ] || [ "$attempt" -ge 3 ]; then
                return "$rc"
              fi
              echo "::warning::git $1 退出码 $rc，第 $attempt 次重试" >&2
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          # One [[branch]] table per branch. Top-level `attrs` and every
          # `[[branch.unit]]`'s attrs name packages the branch carries; a
          # package outside pkgs/by-name cannot be found by diffing file paths,
          # so a branch that carries one declares it here.
          LIST="$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.toml"
          declare -A EXPLICIT=()
          BRANCHES=()
          python3 "$GITHUB_WORKSPACE/fork/nixpkgs-ci/branches.py" tsv \
            --file "$LIST" > "$RUNNER_TEMP/branches.tsv"
          while IFS=$'\t' read -r b attrs; do
            [ -n "$b" ] || continue
            BRANCHES+=("$b")
            if [ -n "$attrs" ]; then
              EXPLICIT["$b"]="$(printf '%s' "$attrs" | tr ',' ' ')"
            fi
          done < "$RUNNER_TEMP/branches.tsv"
          if [ ${#BRANCHES[@]} -eq 0 ]; then
            echo "::error::$LIST 里一个分支都没有；是文件丢了还是格式不对？"
            exit 1
          fi
          echo "branches: ${BRANCHES[*]}"

          # 只取这些分支自己的对象，不碰 fork 的 nixpkgs 历史。必须继续用
          # blob:none：无 filter 的 fetch 会拿 branch tip 去补齐 blobless
          # upstream cache 的 blob，实测 180 秒只传了不到 1 MB。
          refspecs=()
          for b in "${BRANCHES[@]}"; do
            refspecs+=("+refs/heads/$b:refs/remotes/fork/$b")
          done
          git remote add fork "https://github.com/$FORK" 2>/dev/null \
            || git remote set-url fork "https://github.com/$FORK"
          git config remote.fork.promisor true
          git config remote.fork.partialclonefilter blob:none
          retry_git git fetch --no-tags --filter=blob:none fork "${refspecs[@]}"

          # merge-tree 和最后的 checkout 只按需取缺少的 blobs。
          git config extensions.partialClone fork

          retry_git git checkout -q -B "$INTEGRATION" "origin/$UPSTREAM_BRANCH"
          integration_tip=$(git rev-parse HEAD)
          failed=()
          merged=()
          for b in "${BRANCHES[@]}"; do
            echo "::group::$b"
            branch_tip=$(git rev-parse "refs/remotes/fork/$b")
            base=$(git merge-base "$integration_tip" "$branch_tip")
            # Replay the branch's effective diff, not its individual commits. The
            # source branch keeps its history; integration is generated and force-
            # pushed anyway, so checking out 134 magpie updates buys consumers
            # nothing and costs minutes.
            rc=0
            merge_out=$(retry_git git merge-tree --write-tree --messages \
              --merge-base="$base" "$integration_tip" "$branch_tip") || rc=$?
            if [ "$rc" -eq 0 ]; then
              tree=$(printf '%s\n' "$merge_out" \
                | awk '/^[0-9a-f]+$/ && (length($0) == 40 || length($0) == 64) {
                    print; exit
                  }')
              if [ -z "$tree" ]; then
                printf '%s\n' "$merge_out"
                echo "::error::$b: merge-tree 没有输出 tree id"
                exit 1
              fi
              if [ "$tree" = "$(git rev-parse "$integration_tip^{tree}")" ]; then
                echo "$b: no changes"
              else
                count=$(git rev-list --count "$base..$branch_tip")
                integration_tip=$(git commit-tree "$tree" -p "$integration_tip" \
                  -m "integration: $b ($count commits)" \
                  -m "Source: $b at $branch_tip")
              fi
              merged+=("$b")
            elif [ "$rc" -eq 1 ]; then
              printf '%s\n' "$merge_out"
              failed+=("$b")
              echo "::warning::$b 与当前 integration 冲突，这次先跳过它"
            else
              # 128 之类是取不到对象/读不了树，和冲突是两回事。当成冲突处理
              # 会让这个分支从 integration 里静默消失，所以整轮中止。
              printf '%s\n' "$merge_out"
              echo "::error::$b: merge-tree 失败（退出码 $rc），这不是冲突"
              exit 1
            fi
            echo "::endgroup::"
          done

          # Update the working tree once, after all merges. The ref is pushed
          # later, only after every attribute below has built.
          retry_git git checkout -q -B "$INTEGRATION" "$integration_tip"
          git log --oneline "origin/$UPSTREAM_BRANCH..HEAD"

          # 合进来的分支各自声明了哪些属性。两部分取并：by-name 目录名（目录名即属性名，
          # 对 by-name 包是准的），加上显式列表 —— 后者补的是 by-name 看不见的包，
          # 例如定义在 all-packages.nix 里的另一个属性。**不是替代**：写过一次
          # `attrs = ["foo"]` 就把 by-name 的包挤掉，等于默默少建一个。
          : > "$RUNNER_TEMP/attrs.txt"
          for b in "${merged[@]}"; do
            base=$(git merge-base "origin/$UPSTREAM_BRANCH" "refs/remotes/fork/$b")
            git diff --name-only --diff-filter=AM "$base" "refs/remotes/fork/$b" \
              -- 'pkgs/by-name/*/*/package.nix' | awk -F/ '{print $4}' \
              >> "$RUNNER_TEMP/attrs.txt"
            if [ -n "${EXPLICIT[$b]:-}" ]; then
              read -ra explicit_attrs <<< "${EXPLICIT[$b]}"
              printf '%s\n' "${explicit_attrs[@]}" >> "$RUNNER_TEMP/attrs.txt"
            fi
          done
          sort -u "$RUNNER_TEMP/attrs.txt" -o "$RUNNER_TEMP/attrs.txt"
          echo "will build: $(tr '\n' ' ' < "$RUNNER_TEMP/attrs.txt")"

          # 一个分支没合进来不把整条链染红：其余分支照常构建、照常推进。
          # 这类冲突多半是分支基线还没跟上上游，update 会先在 rebase 时自动
          # 消解；没消解掉的由那一轮开 issue，这里只留 warning。但一个都没合
          # 进来时 integration 等于退化成纯 upstream，那是真事故。
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::以下分支没能合并，integration 里暂时没有它们：${failed[*]}"
            if [ ${#merged[@]} -eq 0 ]; then
              echo "::error::一个分支都没合进来，integration 只剩 upstream"
              exit 1
            fi
          fi

      # 漂移检查：分支各自验证时用的是自己的 base，这里是今天的 unstable。
      # drv 没变就是纯下载；变了说明上游动了依赖，必须能编过。
      - name: Build what the branches carry
        run: |
          set -euo pipefail
          cd nixpkgs
          [ -f "$RUNNER_TEMP/attrs.txt" ] || { echo "no attrs"; exit 0; }
          mapfile -t attrs < "$RUNNER_TEMP/attrs.txt"
          if [ ${#attrs[@]} -eq 0 ]; then
            echo "no attributes to build"
            exit 0
          fi
          git checkout -q "$INTEGRATION"
          echo "building: ${attrs[*]}"
          df -h /

          # 逐个属性构建。一次 nix-build 里某个包失败后，排在它后面的属性可能
          # 根本没被调度，而且日志里只剩下一串 drv 路径。分开跑既能继续构建其余
          # 属性，也能在最后一眼看出是哪几个包坏了。
          failed=()
          for a in "${attrs[@]}"; do
            echo "::group::build $a"
            if ! cachix watch-exec mtul -- nix-build -A "$a" --no-out-link; then
              failed+=("$a")
            fi
            echo "::endgroup::"
          done

          df -h /
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::以下属性没有构建成功：${failed[*]}"
            exit 1
          fi

      # 构建全部通过才推进 integration。sysadmin 的 flake.lock 跟着这个分支走，
      # 先推后建会留下一段「分支上已经有新包、缓存里还没有」的窗口，那段时间
      # 本机 `just switch` 只能本地编译。失败时 integration 留在上一个绿 rev，
      # 代价是这一轮的新包推后一小时，换来的是任何 pin 到的 rev 都可直接下载。
      #
      # GITHUB_TOKEN 推不了：integration 分支第一次出现时，整棵 nixpkgs 树都算
      # "新增的 workflow 文件"，需要 workflow 权限。PUSH_TOKEN 是有 workflow
      # scope 的 PAT。
      - name: Publish the integration branch
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd nixpkgs
          rev=$(git rev-parse HEAD)
          git push --force "https://x-access-token:$TOKEN@github.com/$FORK.git" \
            "HEAD:refs/heads/$INTEGRATION"
          echo "published $INTEGRATION at $rev"

      # master 只是 CI 文件的容器，但让它保持「upstream + CI 提交」这个形状：
      # 否则它会悄悄落后几千个提交。这里已经有完整的 upstream 历史，顺手做掉。
      # 构建失败也要跑：master 不依赖 drift check 的结果，不跑的话它会等下一次
      # integrate 成功才追上 upstream。
      - name: Rebase the CI commit onto upstream
        if: always()
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -d nixpkgs/.git ] || { echo "no nixpkgs checkout to rebase"; exit 0; }
          cd nixpkgs
          git fetch --no-tags "https://github.com/$FORK" \
            "+refs/heads/master:refs/remotes/fork/master"
          old=$(git rev-parse refs/remotes/fork/master)
          git checkout -q -B fork-master "$old"

          # -X ours：master 上的自有内容（README.md、nixpkgs-ci/、两个 workflow）冲突时
          # 以 fork 为准。README 是给访客看的门面，上游一改它就会撞车；这里不能因为一次
          # 文档冲突就让 integration 停止更新。
          if ! git rebase -X ours "origin/$UPSTREAM_BRANCH"; then
            git rebase --abort
            echo "::error::fork master 上的提交没法 rebase 到 upstream，需要手工处理"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$old" ]; then
            echo "master 已经是最新的 upstream + CI 提交"
            exit 0
          fi

          # 这次推送是 CI 自己制造的（只是把 CI 提交挪到新 upstream 上），别让它
          # 再触发一整轮构建。两个 -m 之间 git 会插一个空行。
          # 旧 message 里已经有上一轮留下的 [skip ci]，先剥掉再加，否则每小时
          # rebase 一次就多一行。
          git commit -q --amend -m "$(git log -1 --format=%B | sed '/^\[skip ci\]$/d')" -m "[skip ci]"
          git push --force-with-lease="refs/heads/master:$old" \
            "https://x-access-token:$TOKEN@github.com/$FORK.git" "HEAD:refs/heads/master"
