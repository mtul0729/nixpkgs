# master 上的便宜检查：workflow 的 YAML 能不能解析、branches.toml 格式对不对、
# 列出的分支在 fork 上是否真的存在。integrate 取不到分支会硬失败，所以在推
# master 时先拦下来，比跑一整条流水线便宜得多。
name: ci-check

on:
  push:
    branches: [master]
    paths:
      - nixpkgs-ci/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

env:
  FORK: mtul0729/nixpkgs

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 这个 job 只读 .github/ 和 nixpkgs-ci/；整棵 nixpkgs 的 55,400 个文件
      # 会让 checkout 花掉 ~20 秒。设置 sparse-checkout 之后 action 会改用
      # --filter=blob:none，下载量也跟着降下来。
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            nixpkgs-ci
          sparse-checkout-cone-mode: false

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob
          import yaml

          for path in sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(path))
              print('ok', path)
          PY

      - name: Validate branches.toml
        run: |
          set -euo pipefail
          # 结构由 branches.py 校验；属性名是否存在由 update 求值时报，分支是否
          # 存在从下面开始查。
          python3 nixpkgs-ci/branches.py validate \
            --file nixpkgs-ci/branches.toml \
            --out "$RUNNER_TEMP/branch-names.txt"
          while IFS= read -r name; do
            if ! git ls-remote --exit-code "https://github.com/$FORK" \
              "refs/heads/$name" >/dev/null; then
              echo "::error::$name 在 fork 上不存在；integrate 会取不到它"
              exit 1
            fi
            echo "ok $name"
          done < "$RUNNER_TEMP/branch-names.txt"
